<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main gauge circle -->
  <circle cx="12" cy="13" r="7"/>
  <!-- Gauge arc base -->
  <path d="M 6 13 A 6 6 0 0 1 18 13" fill="none" stroke="currentColor" opacity="0.3"/>
  <!-- Needle pointing to upper right -->
  <line x1="12" y1="13" x2="14.5" y2="7" stroke="currentColor" stroke-width="2"/>
  <!-- Needle base -->
  <circle cx="12" cy="13" r="1" fill="currentColor"/>
  <!-- Min mark -->
  <line x1="6" y1="13" x2="5" y2="13" stroke="currentColor" stroke-width="1.5"/>
  <!-- Max mark -->
  <line x1="18" y1="13" x2="19" y2="13" stroke="currentColor" stroke-width="1.5"/>
</svg>