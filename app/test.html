<div class="max-w-2xl mx-auto p-6 bg-white border border-slate-200 rounded-xl shadow-sm">
  <div class="mb-4">
    <h3 class="text-lg font-semibold text-slate-800">Enter Topic</h3>
    <p class="text-sm text-slate-500">Provide a topic or leave blank to let AI take the lead.</p>
  </div>

  <div class="relative flex flex-col gap-3">
    <div class="flex items-center gap-2">
      <div class="relative flex-grow">
        <input 
          type="text" 
          placeholder="e.g., Quantum Physics or Digital Marketing..." 
          class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400"
        />
      </div>

      <button class="flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-all shadow-md active:scale-95 whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
        </svg>
        <span>Generate</span>
      </button>
    </div>

    <div class="flex items-center justify-between px-1">
      <span class="text-xs text-slate-400 flex items-center gap-1">
        <kbd class="px-1.5 py-0.5 rounded border border-slate-200 bg-white font-sans">Enter</kbd> to start
      </span>
      
      <button class="text-xs font-medium text-blue-600 hover:text-blue-800 hover:underline transition-all">
        Feeling uninspired? Surprise me.
      </button>
    </div>
  </div>

  <div class="mt-8 pt-4 border-t border-slate-100 flex justify-end">
    <button class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-red-500 hover:bg-red-50 rounded-md transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      Delete Component
    </button>
  </div>
</div>
